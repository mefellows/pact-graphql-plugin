name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACT_DO_NOT_TRACK: 'true'

jobs:
  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints only need checking once; the matrix exists to prove the core
      # builds and passes on every platform we ship a binary for.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  js:
    name: JS consumer DSL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/pact-graphql-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/pact-graphql-helper/package-lock.json

      - run: npm ci

      # `npm test` runs vitest plus the type check, which includes the pact-js conformance
      # check — the guard that fails here, and only here, if pact-js's plugin interaction
      # types drift from the structural mirrors in src/types.ts.
      - run: npm test

      - run: npm run build

  example:
    name: Example consumer + provider verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs the freshly built plugin into ~/.pact/plugins so the example runs against
      # this commit's binary rather than whatever happens to be on the machine.
      - name: Build and install the plugin
        run: just install

      - name: Build the consumer DSL
        working-directory: js/pact-graphql-helper
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: examples/js/product-consumer
        run: npm install

      - name: Typecheck the example
        working-directory: examples/js/product-consumer
        run: npm run typecheck

      # Two phases on purpose: `test` writes the pacts, `verify` verifies them against the
      # example provider. Vitest does not order files, so verification cannot share a pass
      # with the tests that generate its input.
      - name: Consumer tests and provider verification
        working-directory: examples/js/product-consumer
        run: npm run test:all

      - name: Upload generated pacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: examples/js/product-consumer/pacts/
          if-no-files-found: warn

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go/pactgraphql/go.sum

      # pact-go links against the native pact_ffi library, which is not vendored.
      - name: Install pact-go native libraries
        run: |
          go install github.com/pact-foundation/pact-go/v2@latest
          sudo "$(go env GOPATH)/bin/pact-go" -l DEBUG install

      - name: Test
        working-directory: go/pactgraphql
        run: go test ./...

  bundle:
    name: Bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      # Proves the release path still works on every PR, so a broken bundle recipe is found
      # here rather than during a release.
      - name: Bundle the host target
        run: just bundle "$(rustc -Vv | awk '/host/ {print $2}')"

      - name: Show artifacts
        run: ls -R dist
