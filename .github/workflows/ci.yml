name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PACT_DO_NOT_TRACK: 'true'

jobs:
  # Cheap and first: a version mismatch between the crate, the npm package and the DSL's plugin
  # floor breaks the example suite with errors that point nowhere near the cause.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-versions.sh

  rust:
    name: Rust core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting and lints only need checking once; the matrix exists to prove the core
      # builds and passes on every platform we ship a binary for.
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  js:
    name: JS consumer DSL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js/pact-graphql-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: js/pact-graphql-helper/package-lock.json

      - run: npm ci

      # `npm test` runs vitest plus the type check, which includes the pact-js conformance
      # check — the guard that fails here, and only here, if pact-js's plugin interaction
      # types drift from the structural mirrors in src/types.ts.
      - run: npm test

      - run: npm run build

  example:
    name: Example consumer + provider verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Installs the freshly built plugin into ~/.pact/plugins so the example runs against
      # this commit's binary rather than whatever happens to be on the machine.
      - name: Build and install the plugin
        run: just install

      - name: Build the consumer DSL
        working-directory: js/pact-graphql-helper
        run: npm ci && npm run build

      - name: Install example dependencies
        working-directory: examples/js/product-consumer
        run: npm install

      - name: Typecheck the example
        working-directory: examples/js/product-consumer
        run: npm run typecheck

      # Two phases on purpose: `test` writes the pacts, `verify` verifies them against the
      # example provider. Vitest does not order files, so verification cannot share a pass
      # with the tests that generate its input.
      - name: Consumer tests and provider verification
        working-directory: examples/js/product-consumer
        run: npm run test:all

      - name: Upload generated pacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts
          path: examples/js/product-consumer/pacts/
          if-no-files-found: warn

  go:
    name: Go binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Taken from go.mod rather than pinned here, so the two cannot drift.
          go-version-file: go/pactgraphql/go.mod
          cache-dependency-path: go/pactgraphql/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      # The Go tests are integration tests: they build real pacts through the plugin, so the
      # plugin has to be installed, not just pact-go's native library. The binding asks for
      # plugin version "0.0.0", which the driver treats as a floor, so any installed build
      # satisfies it.
      - name: Build and install the plugin
        run: just install

      # pact-go links against the native pact_ffi library, which is not vendored. The CLI must be
      # installed at the *same version the module depends on*: the library it downloads is chosen
      # by the CLI's version, and a newer one exports a different symbol set. Installing @latest
      # against a module on v2.4.2 fetched libpact_ffi 0.5.6 and failed to link with undefined
      # references to `pactffi_verify` and `pactffi_create_mock_server_for_pact`.
      - name: Install pact-go native libraries
        working-directory: go/pactgraphql
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/pact-foundation/pact-go/v2)
          echo "installing pact-go CLI $version to match the module"
          go install "github.com/pact-foundation/pact-go/v2@${version}"
          sudo "$(go env GOPATH)/bin/pact-go" -l DEBUG install

      - name: Test
        working-directory: go/pactgraphql
        run: go test ./...

  bundle:
    name: Bundle smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: extractions/setup-just@v2

      # Proves the release path still works on every PR, so a broken bundle recipe is found
      # here rather than during a release.
      - name: Bundle the host target
        run: just bundle "$(rustc -Vv | awk '/host/ {print $2}')"

      - name: Show artifacts
        run: ls -R dist
