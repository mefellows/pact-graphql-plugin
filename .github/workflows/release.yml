name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Granted per job below rather than globally, so the publish job is the only thing that can
# mint an OIDC token and the build jobs cannot write to pull requests.
permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Opens/maintains a release PR from conventional commits. When that PR merges, this job
  # reports `releases_created` and the jobs below attach artifacts and publish.
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      # Manifest-mode outputs are keyed by package *path*, not component name.
      tag_name: ${{ steps.release.outputs['pact-graphql-plugin--tag_name'] }}
      version: ${{ steps.release.outputs['pact-graphql-plugin--version'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # One archive per supported target, matching the layout `just bundle` already produces so
  # the release assets and a local `just bundle-all` cannot drift.
  binaries:
    name: ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: gcc-aarch64-linux-gnu
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: extractions/setup-just@v2

      - name: Install cross linker
        if: matrix.linker != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.linker }}
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # `jq` is a bundle prerequisite and is absent from the Windows runners' Git Bash.
      - name: Install jq (Windows)
        if: runner.os == 'Windows'
        run: choco install jq --no-progress -y
        shell: pwsh

      - name: Bundle
        shell: bash
        run: just bundle ${{ matrix.target }}

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            dist/${{ matrix.target }}/*.gz \
            dist/${{ matrix.target }}/*.sha256 \
            --clobber

  # The manifest the plugin driver reads when installing from a release. Uploaded once, not
  # per target, because it is target independent.
  manifest:
    name: Plugin manifest
    needs: [release-please, binaries]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the released version into the manifest
        run: |
          jq --arg v "${{ needs.release-please.outputs.version }}" '.version = $v' \
            pact-plugin.json > pact-plugin.release.json
          mv pact-plugin.release.json pact-plugin.json
          cat pact-plugin.json

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            pact-plugin.json --clobber

  npm:
    name: Publish npm package
    needs: [release-please, binaries]
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints the short-lived OIDC token npm exchanges for publish rights. This is the whole
      # mechanism: there is no npm token anywhere in this workflow.
      id-token: write
    defaults:
      run:
        working-directory: js/pact-graphql-helper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: js/pact-graphql-helper/package-lock.json

      # Trusted publishing needs npm >= 11.5.1; Node 20 still bundles npm 10.x. Pinned to the
      # floor rather than `@latest` so a future npm major cannot silently change publish
      # behaviour, and asserted so a regression fails here rather than at the publish step.
      - name: Install an npm that supports trusted publishing
        run: |
          npm install -g 'npm@^11.5.1'
          installed=$(npm --version)
          echo "npm $installed"
          # Fails loudly here rather than as an opaque auth error at the publish step.
          if [ "$(printf '%s\n' '11.5.1' "$installed" | sort -V | head -1)" != '11.5.1' ]; then
            echo "npm $installed is older than the 11.5.1 required for trusted publishing" >&2
            exit 1
          fi

      - run: npm ci

      # Publishing an untested build would defeat the point of the gate.
      - run: npm test

      - run: npm run build

      # npm verifies the provenance attestation against `repository.url`, and rejects the publish
      # with a 422 when they disagree. Provenance necessarily records the repository the build
      # actually ran in, so the manifest is aligned to that here rather than to whatever is
      # committed -- which keeps publishing working if the repository is ever moved or forked,
      # instead of failing after a release has already been tagged.
      - name: Align repository metadata with the publishing repository
        run: |
          npm pkg set "repository.url=git+https://github.com/${GITHUB_REPOSITORY}.git"
          npm pkg set "homepage=https://github.com/${GITHUB_REPOSITORY}#readme"
          npm pkg set "bugs.url=https://github.com/${GITHUB_REPOSITORY}/issues"
          npm pkg get repository homepage bugs

      # No NODE_AUTH_TOKEN: authentication is the OIDC token minted from `id-token: write`,
      # exchanged for a short-lived, workflow-scoped credential by npm.
      #
      # Trusted publishing generates provenance automatically and `--provenance` is documented as
      # unnecessary, but it is passed explicitly because several reports of publishes failing
      # without it are open against npm/cli, and it is a no-op when provenance is already on.
      - name: Publish
        run: npm publish --provenance --access public
